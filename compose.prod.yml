services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myfavoriteplaces
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myfavoriteplaces"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: mfp-server:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/myfavoriteplaces
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: myfavoriteplaces
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  client:
    image: mfp-client:latest
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pgdata: